[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-mycelium"
version = "0.3.0"
description = "IoT Agents z pamięcią Mycelium – agenci PyTorch na prawdziwych danych, uczenie federacyjne i wspólna pamięć"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "filelock>=3.13",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
# PyTorch CPU: pip install -e ".[ai]" --extra-index-url https://download.pytorch.org/whl/cpu
ai = ["torch>=2.5", "optuna>=4", "fastapi>=0.115", "uvicorn>=0.30", "paho-mqtt>=2", "httpx>=0.27", "websockets>=13"]
# węzeł grzybni bez przeglądarki: pip install "iot-mycelium[node]" --extra-index-url https://download.pytorch.org/whl/cpu
node = ["torch>=2.5", "websockets>=13"]

[project.scripts]
iot-mycelium = "iot_mycelium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",   # assert w testach
    "S301",   # pickle – tylko własne pliki agentów (opisane w persistent_agent.py)
    "S311",   # random w symulacji IoT nie jest kryptografią
    "S603", "S607",  # subprocess w komendzie `dashboard`
    "E501",   # długość linii pilnuje formatter
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["slow: dłuższe testy (dashboard, wieloprocesowe)"]
