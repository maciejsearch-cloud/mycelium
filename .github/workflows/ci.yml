name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks skanuje całą historię
      - name: Sekrety (gitleaks, cała historia)
        env:
          GL_VER: "8.21.2"
          GL_SHA: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact -l warn
      - name: Brak odpowiedzi kontrolnych (gold) i plików .env w repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.gold/|^supabase/gold[^/]*\.sql$|(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Niedozwolone pliki w repo:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.8"
      - name: Ruff lint
        run: ruff check src tests benchmarks scripts
      - name: Ruff format
        run: ruff format --check src tests benchmarks scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Broker MQTT (test mostu)
        run: sudo apt-get install -y -q mosquitto
      - name: Install
        run: python -m pip install -e ".[dev,ai]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Pytest
        env:
          MPLBACKEND: Agg
          IOT_MYCELIUM_SYNTHETIC: "1"
        run: pytest -q --cov=iot_mycelium --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historia gita dla strony „Postępy projektu”
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Rozbiór zdań – TypeScript = Python (400 zdań testu UD)
        run: node scripts/rozbior-parity.mjs
      - name: Rozbiór – warstwa Morfeusza TypeScript = Python
        run: node scripts/morf-parity.mjs
      - name: Rozmówca – regresja na zbiorach rozmów (dev, zamrożone v1/v2)
        run: |
          node scripts/rozmowa-eval.mjs dev --min 38
          node scripts/rozmowa-eval.mjs frozen --min 66
          node scripts/rozmowa-eval.mjs frozen-v2 --min 30
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
