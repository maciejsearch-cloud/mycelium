name: Wzrost grzybni (cron)

# Autonomiczny węzeł Python: co 6 h mierzy cele, wybiera niszę z ciekawości,
# testuje zmiany i przyjmuje tylko te bez regresji; odpowiada na pewne pytania z czujnika.
# Zapisuje wyłącznie do własnych tabel myc_* (klucz publikowalny + RLS + limiter).
# Koszt: ~1 min na przebieg, w darmowym limicie Actions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      MYC_NODE_ID: c830fd26-b8ad-4783-9b7c-0f647e0e4ce5
      IOT_MYCELIUM_NODE_DIR: /tmp/myc-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q "numpy>=2.0"
      - name: Cykl wzrostu
        run: python -m iot_mycelium.ai.growth --cycles 2
